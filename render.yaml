services:
  - type: web
    name: cfi-pos-api
    runtime: docker
    plan: starter
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNCHRONIZE
        value: "false"
      - key: PG_POOL_MAX
        value: "10"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ETIMS_MODE
        value: "off"
      - key: ETIMS_VSCU_BASE_URL
        sync: false
      - key: ETIMS_KRA_PIN
        sync: false
      - key: ETIMS_BRANCH_ID
        sync: false
      - key: ETIMS_DEVICE_SERIAL
        sync: false
      - key: ETIMS_INITIAL_INVOICE_NUMBER
        sync: false
      - key: ETIMS_PAYMENT_TYPE_CASH
        sync: false
      - key: ETIMS_PAYMENT_TYPE_MPESA
        sync: false
      - key: ETIMS_PAYMENT_TYPE_STORE_CREDIT
        sync: false
